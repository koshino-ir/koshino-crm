[project]
name = "koshino-crm-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "django-cors-headers>=4.4",
    "djangorestframework-simplejwt>=5.3",
    "django-environ>=0.11",
    "python-dotenv>=1.0",
    "django-redis>=5.4",
    "celery>=5.4",
    "redis>=5.0",
    "drf-spectacular>=0.27",
    "argon2-cffi>=23.1",
    "gunicorn>=23.0",
    "requests>=2.32",
    "Pillow>=10.4", 
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.7",
    "black>=24.8",
    "mypy>=1.11",
    "django-stubs>=5.0",
    "djangorestframework-stubs>=3.15",
    "ipython>=8.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"