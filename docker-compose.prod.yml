services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ internal ]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ internal ]

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DJANGO_COLLECTSTATIC: "true"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    entrypoint: [ "sh", "/app/entrypoint.sh" ]
    command: [ "gunicorn", "config.wsgi:application", "-b", "0.0.0.0:8000", "-w", "4", "--threads", "2", "--access-logfile", "-", "--error-logfile", "-" ]
    networks: [ internal ]

  celery-worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: [ "celery", "-A", "config", "worker", "-l", "info", "--concurrency=2" ]
    networks: [ internal ]

  celery-beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: [ "celery", "-A", "config", "beat", "-l", "info" ]
    networks: [ internal ]

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: prod
    restart: unless-stopped
    depends_on: [ backend ]
    volumes:
      - staticfiles:/var/www/static:ro
      - media:/var/www/media:ro
    ports:
      - "80:80"
    networks: [ internal ]

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  staticfiles:
  media:
